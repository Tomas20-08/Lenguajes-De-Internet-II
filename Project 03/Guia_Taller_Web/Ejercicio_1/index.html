<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Estudiantes</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <div class="contenedor">
    <section class="tarjeta">
      <header>
        <div class="icono">🎓</div>
        <h1>Registro de Estudiantes</h1>
        <p>Complete sus datos para realizar el registro académico.</p>
        <div id="bienvenida" class="bienvenida"></div>
      </header>

      <form id="formulario">
        <div class="campo">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" required placeholder="Ejemplo: Laura Gómez">
        </div>

        <div class="campo">
          <label for="documento">Documento</label>
          <input type="text" id="documento" required>
        </div>

        <div class="campo">
          <label for="correo">Correo electrónico</label>
          <input type="email" id="correo" required>
        </div>

        <div class="campo">
          <label for="programa">Programa</label>
          <select id="programa" required>
            <option value="">Seleccione</option>
            <option>Desarrollo de Software</option>
            <option>Ingeniería de Sistemas</option>
            <option>Administración</option>
          </select>
        </div>

        <fieldset>
          <legend>Jornada</legend>
          <div class="opciones">
            <label>
              <input type="radio" name="jornada" value="Mañana" required>
              Mañana
            </label>
            <label>
              <input type="radio" name="jornada" value="Noche">
              Noche
            </label>
          </div>
        </fieldset>

        <div class="campo">
          <label for="observaciones">Observaciones</label>
          <textarea id="observaciones" rows="4"></textarea>
        </div>

        <label class="aceptacion">
          <input type="checkbox" required>
          Acepto el tratamiento de datos.
        </label>

        <div class="botones">
          <button type="submit" class="principal">Registrar</button>
          <button type="reset" class="secundario">Limpiar</button>
        </div>
      </form>
    </section>
  </div>

  <script src="js/app.js" defer></script>
</body>
</html>
